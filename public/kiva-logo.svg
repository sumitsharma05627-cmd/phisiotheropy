<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Shadow filter for subtle elevation -->
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#072032" flood-opacity="0.15" />
    </filter>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48bb78" />
      <stop offset="100%" stop-color="#229645" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38a169" />
      <stop offset="100%" stop-color="#2f855a" />
    </linearGradient>
  </defs>

  <!-- Base Canvas (White Disc) -->
  <circle cx="250" cy="250" r="246" fill="#ffffff" />

  <!-- Outer Dark Navy Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#072032" stroke-width="14" />

  <!-- Inner Spacing & Green Ring -->
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#ringGrad)" stroke-width="5" />

  <!-- Subtle Spine / Anatomy Silhouette Background Watermark -->
  <g opacity="0.07" fill="#072032" transform="translate(250, 160) scale(0.85)">
    <!-- Vertebrae chain -->
    <ellipse cx="0" cy="-60" rx="14" ry="7" />
    <ellipse cx="0" cy="-44" rx="16" ry="8" />
    <ellipse cx="0" cy="-26" rx="18" ry="9" />
    <ellipse cx="0" cy="-6" rx="20" ry="10" />
    <ellipse cx="0" cy="16" rx="22" ry="10" />
    <ellipse cx="0" cy="40" rx="25" ry="11" />
    <ellipse cx="0" cy="66" rx="28" ry="12" />
    <ellipse cx="0" cy="94" rx="30" ry="13" />
    <!-- Back profile contour -->
    <path d="M-90,-80 C-40,-50 -30,20 -50,110 C-30,120 30,120 50,110 C30,20 40,-50 90,-80 Z" fill="#072032" />
  </g>

  <!-- ==================== LOGO TEXT: KIVA ==================== -->
  <g transform="translate(250, 185)" text-anchor="middle">
    <!-- Main KIVA Letters drawn with clean vector geometry -->
    <g fill="#072032">
      <!-- Letter K -->
      <path d="M-152,0 L-124,0 L-124,-60 L-152,-60 Z M-124,-34 L-78,-60 L-42,-60 L-95,-29 L-38,0 L-76,0 L-115,-22 L-124,-17 L-124,0 Z" />
      
      <!-- Letter I -->
      <path d="M-34,0 L-6,0 L-6,-60 L-34,-60 Z" />
      
      <!-- Letter V -->
      <path d="M10,-60 L38,-60 L62,-10 L86,-60 L114,-60 L78,0 L46,0 Z" />
      
      <!-- Letter A (Left side and crossbar in Navy) -->
      <path d="M122,0 L146,-60 L176,-60 L204,0 L176,0 L169,-17 L147,-17 L140,0 Z M152,-28 L164,-28 L158,-44 Z" />
    </g>

    <!-- Stylized Green Leaf accent on letter A -->
    <path d="M172,-40 C185,-58 210,-48 220,-32 C204,-30 186,-34 172,-40 Z" fill="url(#leafGrad)" />
  </g>

  <!-- ==================== PHYSIOTHERAPY CLINIC ==================== -->
  <g transform="translate(250, 218)">
    <!-- Left Thin Horizontal Accent Line -->
    <line x1="-190" y1="-5" x2="-145" y2="-5" stroke="#258540" stroke-width="2" stroke-linecap="round" />
    
    <!-- Text -->
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="17" fill="#258540" letter-spacing="3.5">
      PHYSIOTHERAPY CLINIC
    </text>
    
    <!-- Right Thin Horizontal Accent Line -->
    <line x1="145" y1="-5" x2="190" y2="-5" stroke="#258540" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ==================== MOTTO ==================== -->
  <g transform="translate(250, 244)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#1e293b" letter-spacing="2">
      MOVE BETTER. FEEL BETTER. LIVE BETTER.
    </text>
    <!-- ECG / Heartbeat line underneath FEEL BETTER -->
    <path d="M-18,12 L-10,12 L-6,6 L-2,18 L3,3 L7,15 L11,12 L18,12" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- ==================== 5 CLINICAL SPECIALTY BADGES ==================== -->
  <g transform="translate(250, 298)">
    <!-- 1. Running Athlete (Sports Injury) -->
    <g transform="translate(-130, 0)">
      <circle cx="0" cy="0" r="22" fill="#072032" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
      <!-- Runner icon -->
      <circle cx="1" cy="-10" r="3.2" fill="#ffffff" />
      <path d="M-6,-3 C-2,-5 5,-5 7,-2 L4,4 L9,7 M-1,1 L-4,8 L-10,9 M2,5 L0,12 L-4,13" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- 2. Vertebral Column / Spine (Spine & Neck) -->
    <g transform="translate(-65, 0)">
      <circle cx="0" cy="0" r="22" fill="#072032" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
      <!-- Spine chain discs -->
      <ellipse cx="0" cy="-12" rx="4.5" ry="2" fill="#ffffff" />
      <ellipse cx="0" cy="-7" rx="5.5" ry="2.2" fill="#ffffff" />
      <ellipse cx="0" cy="-2" rx="6.5" ry="2.4" fill="#ffffff" />
      <ellipse cx="0" cy="3" rx="6" ry="2.3" fill="#ffffff" />
      <ellipse cx="0" cy="8" rx="5.5" ry="2.2" fill="#ffffff" />
      <ellipse cx="0" cy="13" rx="4.5" ry="2" fill="#ffffff" />
      <!-- Lateral spinal nerve nodes -->
      <circle cx="-6" cy="-2" r="1" fill="#48bb78" />
      <circle cx="6" cy="-2" r="1" fill="#48bb78" />
      <circle cx="-5" cy="3" r="1" fill="#48bb78" />
      <circle cx="5" cy="3" r="1" fill="#48bb78" />
    </g>

    <!-- 3. Manual Physiotherapy / Treatment Bed -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="22" fill="#072032" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
      <!-- Bed -->
      <line x1="-12" y1="5" x2="12" y2="5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="-10" y1="5" x2="-10" y2="12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <line x1="10" y1="5" x2="10" y2="12" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
      <!-- Patient lying down -->
      <circle cx="8" cy="1" r="2" fill="#ffffff" />
      <path d="M6,3 L-8,3" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <!-- Therapist standing and treating -->
      <circle cx="-6" cy="-8" r="2.5" fill="#ffffff" />
      <path d="M-6,-5 L-4,0 L1,2" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" />
    </g>

    <!-- 4. Knee Joint / Orthopedic Bone -->
    <g transform="translate(65, 0)">
      <circle cx="0" cy="0" r="22" fill="#072032" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
      <!-- Femur (top) -->
      <path d="M-2,-13 L2,-13 L3,-5 C4,-2 6,-1 6,0 C4,1 2,0 0,0 C-2,0 -4,1 -6,0 C-6,-1 -4,-2 -3,-5 Z" fill="#ffffff" />
      <!-- Tibia / Fibula (bottom) -->
      <path d="M-5,3 C-3,3 0,4 2,3 C4,3 5,4 5,5 L3,13 L-3,13 L-5,5 Z" fill="#ffffff" />
      <!-- Patella dot -->
      <circle cx="0" cy="1.5" r="2.2" fill="#48bb78" />
    </g>

    <!-- 5. Active Movement / Posture Wellness -->
    <g transform="translate(130, 0)">
      <circle cx="0" cy="0" r="22" fill="#072032" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
      <!-- Reaching figure -->
      <circle cx="0" cy="-9" r="3" fill="#ffffff" />
      <!-- Raised arms in victory -->
      <path d="M-9,-4 C-6,-1 -2,0 0,0 C2,0 6,-1 9,-4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <!-- Torso & Legs -->
      <line x1="0" y1="0" x2="0" y2="7" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
      <path d="M-5,13 L0,7 L5,13" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- ==================== DR. NARESH (PT) PILL BADGE ==================== -->
  <g transform="translate(250, 368)">
    <!-- Dark Navy Pill Container with shadow -->
    <rect x="-115" y="-23" width="230" height="46" rx="15" fill="#072032" />
    
    <!-- Doctor Name -->
    <text x="0" y="-3" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="18" fill="#ffffff" letter-spacing="2.5">
      DR. NARESH
    </text>
    
    <!-- (PT) with green dashes -->
    <g transform="translate(0, 14)">
      <line x1="-42" y1="-4" x2="-22" y2="-4" stroke="#48bb78" stroke-width="2" stroke-linecap="round" />
      <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="13" fill="#48bb78" letter-spacing="1">
        (PT)
      </text>
      <line x1="22" y1="-4" x2="42" y2="-4" stroke="#48bb78" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- ==================== EXPERT CARE | PERSONALIZED RECOVERY ==================== -->
  <g transform="translate(250, 420)">
    <text x="0" y="0" text-anchor="middle" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="11" fill="#072032" letter-spacing="1.5">
      EXPERT CARE. <tspan fill="#38a169" font-weight="400">|</tspan> PERSONALIZED RECOVERY.
    </text>
  </g>

  <!-- Bottom Crescent Green Accent Arc -->
  <path d="M95,385 C135,435 190,466 250,466 C310,466 365,435 405,385 C372,425 315,452 250,452 C185,452 128,425 95,385 Z" fill="url(#ringGrad)" />
</svg>
